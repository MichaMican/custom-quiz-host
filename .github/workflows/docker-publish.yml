name: Build and Publish Docker Image

on:
  push:
    branches:
      - main
    paths-ignore:
      - ".github/**"
      - ".vscode/**"
      - "*.md"
      - "website/**"
  pull_request:
    types: [opened, synchronize, ready_for_review]
    paths-ignore:
      - ".github/**"
      - ".vscode/**"
      - "*.md"
      - "website/**"
  workflow_dispatch:

concurrency:
  group: docker-publish-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    uses: MichaMican/reusable-actions/.github/workflows/semver-version.yml@main
    with:
      is_prerelease: ${{ github.event_name != 'workflow_dispatch' || github.ref != 'refs/heads/main' }}
      suppress_release: ${{ github.ref != 'refs/heads/main' }}
      prerelease_name: ${{ github.ref != 'refs/heads/main' && 'internal' || (github.event_name == 'push' && 'preview') || '' }}
    permissions:
      contents: write
      actions: read

  build-and-push:
    runs-on: ubuntu-latest
    needs: version
    permissions:
      actions: read
      contents: read
      packages: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Set lowercase image name
        run: echo "IMAGE_NAME=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Determine Docker tags
        id: docker-tags
        run: |
          TAGS="${IMAGE_NAME}:${{ needs.version.outputs.version }}"

          if [ "${{ github.event_name }}" == "pull_request" ] || [ "${{ github.ref }}" != "refs/heads/main" ]; then
            # Internal release (PR or non-main branch): version + internal
            TAGS="$TAGS"$'\n'"${IMAGE_NAME}:internal"
          elif [ "${{ github.event_name }}" == "push" ]; then
            # Preview release: version + preview
            TAGS="$TAGS"$'\n'"${IMAGE_NAME}:preview"
          else
            # Stable release: version + latest + preview + internal
            TAGS="$TAGS"$'\n'"${IMAGE_NAME}:latest"
            TAGS="$TAGS"$'\n'"${IMAGE_NAME}:preview"
            TAGS="$TAGS"$'\n'"${IMAGE_NAME}:internal"
          fi

          {
            echo "tags<<EOF"
            echo "$TAGS"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: CustomQuizHost.Server/Dockerfile
          push: true
          build-args: |
            VERSION=${{ needs.version.outputs.version }}
          tags: ${{ steps.docker-tags.outputs.tags }}

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
          TAGS: ${{ steps.docker-tags.outputs.tags }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          JOB_NAME: ${{ github.job }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Build the tag list (extract tag name after the last colon)
          TAG_LIST=$(echo "$TAGS" | rev | cut -d: -f1 | rev | sed 's/^/- `/' | sed 's/$/`/')
          JOB_URL=$(gh api "repos/${{ github.repository }}/actions/runs/${RUN_ID}/jobs" \
            --jq ".jobs[] | select(.name == \"${JOB_NAME}\") | .html_url" | head -1)
          JOB_URL="${JOB_URL:-$RUN_URL}"

          COMMENT_BODY="<!-- docker-publish-comment -->
          ### 🚀 Docker Image Published

          **Version:** \`${VERSION}\`

          **Action job:** [View job](${JOB_URL})

          **Channels (image tags):**
          ${TAG_LIST}"

          # Update existing comment if present, otherwise create a new one
          COMMENT_ID=$(gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
            --jq '.[] | select(.body | contains("<!-- docker-publish-comment -->")) | .id' | tail -1 || true)

          if [ -n "$COMMENT_ID" ]; then
            gh api "repos/${{ github.repository }}/issues/comments/${COMMENT_ID}" \
              -X PATCH -f body="$COMMENT_BODY"
          else
            gh pr comment "${PR_NUMBER}" --body "$COMMENT_BODY"
          fi
